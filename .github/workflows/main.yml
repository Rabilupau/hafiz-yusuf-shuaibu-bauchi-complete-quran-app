name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Quran App
        run: |
          unzip -q "Qur'an-Audio-App Original.zip"
          echo "Quran app extracted successfully"
          ls -la

      - name: Check Android project
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          echo "Android project is ready"

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HAFIZ-Yusuf-Shuaibu-Bauchi-Complete-Quran-APK
          path: "app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
