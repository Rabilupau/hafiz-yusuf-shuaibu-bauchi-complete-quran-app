name: Build HAFIZ Yusuf Shuaibu Bauchi Complete Qur'an APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract FINAL BUILD project
        run: |
          rm -rf build-project
          mkdir build-project
          unzip -q HAFIZ-Yusuf-Shuaibu-Bauchi-Complete-Quran-FINAL-BUILD.zip -d build-project

      - name: Check Android project
        working-directory: build-project
        run: |
          echo "Checking project..."
          ls -la
          ls -la app

      - name: Build Debug APK
        working-directory: build-project
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HAFIZ-Yusuf-Shuaibu-Bauchi-Complete-Quran-APK
          path
