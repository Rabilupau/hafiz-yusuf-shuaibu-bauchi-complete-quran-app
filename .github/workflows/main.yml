name: Build HAFIZ Yusuf Shuaibu Bauchi Complete Quran APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Quran Web App
        run: |
          set -e

          unzip -q "Qur'an-Audio-App Original.zip" -d quran-web

          echo "Quran Web App extracted"

          find quran-web -maxdepth 4 -type f | sort

      - name: Check Quran Web App
        run: |
          set -e

          test -f "quran-web/index.html"
          test -f "quran-web/style.css"
          test -f "quran-web/script.js"
          test -f "quran-web/manifest.json"
          test -f "quran-web/service-worker.js"

          test -f "quran-web/assets/icon.png"
          test -f "quran-web/assets/splash.png"

          test -d "quran-web/audio"

          echo "Web app files OK"

      - name: Create Android Project
        run: |
          set -e

          mkdir -p android-app/app/src/main/java/com/rabilu/quranaudio
          mkdir -p android-app/app/src/main/assets
          mkdir -p android-app/app/src/main/res/drawable
          mkdir -p android-app/app/src/main/res/values

          cat > android-app/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "HAFIZ-Yusuf-Shuaibu-Bauchi-Complete-Quran"
          include(":app")
          EOF

          cat > android-app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > android-app/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.enableJetifier=false
          EOF

          cat > android-app/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rabilu.quranaudio'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.rabilu.quranaudio'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/icon"
                  android:label="HAFIZ Yusuf Shuaibu Bauchi Complete Qur'an"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > android-app/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#075e54</item>
                  <item name="android:navigationBarColor">#075e54</item>
                  <item name="android:statusBarColor">#075e54</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF

          cat > android-app/app/src/main/java/com/rabilu/quranaudio/MainActivity.java <<'EOF'
          package com.rabilu.quranaudio;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(
                      new WebViewClient()
                  );

                  webView.addJavascriptInterface(
                      new AndroidShare(),
                      "AndroidShare"
                  );

                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  );
              }

              public class AndroidShare {

                  @JavascriptInterface
                  public void shareText(
                          String title,
                          String text,
                          String url
                  ) {

                      String message = text;

                      if (
                          url != null &&
                          !url.isEmpty() &&
                          !url.startsWith("file:")
                      ) {
                          message =
                              message +
                              "\n\n" +
                              url;
                      }

                      Intent sendIntent =
                          new Intent(Intent.ACTION_SEND);

                      sendIntent.setType("text/plain");

                      sendIntent.putExtra(
                          Intent.EXTRA_SUBJECT,
                          title
                      );

                      sendIntent.putExtra(
                          Intent.EXTRA_TEXT,
                          message
                      );

                      Intent chooser =
                          Intent.createChooser(
                              sendIntent,
                              "Share App"
                          );

                      startActivity(chooser);
                  }
              }

              @Override
              public void onBackPressed() {

                  if (
                      webView != null &&
                      webView.canGoBack()
                  ) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Copy Quran App Files
        run: |
          set -e

          cp "quran-web/index.html" \
             "android-app/app/src/main/assets/"

          cp "quran-web/style.css" \
             "android-app/app/src/main/assets/"

          cp "quran-web/script.js" \
             "android-app/app/src/main/assets/"

          cp "quran-web/manifest.json" \
             "android-app/app/src/main/assets/"

          cp "quran-web/service-worker.js" \
             "android-app/app/src/main/assets/"

          cp -r "quran-web/assets" \
             "android-app/app/src/main/assets/"

          cp -r "quran-web/audio" \
             "android-app/app/src/main/assets/"

          cp "quran-web/assets/icon.png" \
             "android-app/app/src/main/res/drawable/icon.png"

          echo "Quran app files copied successfully."

      - name: Fix Share Function
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "android-app/app/src/main/assets/script.js"
          )

          text = path.read_text(encoding="utf-8")

          start_marker = (
              "/* =====================================================\n"
              "   SHARE\n"
              "   ===================================================== */"
          )

          start = text.find(start_marker)

          if start == -1:
              raise SystemExit(
                  "ERROR: SHARE section was not found."
              )

          next_marker = text.find(
              "/* =====================================================",
              start + len(start_marker)
          )

          if next_marker == -1:
              raise SystemExit(
                  "ERROR: Next script section was not found."
              )

          new_share = r'''/* =====================================================
   SHARE
   ===================================================== */

if (shareAppButton) {

    shareAppButton.addEventListener(
        "click",
        async () => {

            const title =
                "HAFIZ Yusuf Shuaibu Bauchi Complete Qur’an";

            const text =
                "Listen to the Holy Qur’an Surah by Surah — HAFIZ Yusuf Shuaibu Bauchi Complete Qur’an.";

            const url =
                window.location.href;

            if (
                window.AndroidShare &&
                typeof window.AndroidShare.shareText === "function"
            ) {

                window.AndroidShare.shareText(
                    title,
                    text,
                    url
                );

                return;
            }

            if (
                navigator.share &&
                typeof navigator.share === "function"
            ) {

                try {

                    await navigator.share({
                        title: title,
                        text: text,
                        url: url
                    });

                } catch (error) {

                    console.log(
                        "Share cancelled:",
                        error
                    );
                }

                return;
            }

            try {

                if (
                    navigator.clipboard &&
                    typeof navigator.clipboard.writeText === "function"
                ) {

                    await navigator.clipboard.writeText(url);

                    showToast(
                        "App link copied"
                    );

                    return;
                }

            } catch (error) {

                console.log(
                    "Clipboard failed:",
                    error
                );
            }

            showToast(
                "Sharing is not available"
            );
        }
    );

}

'''

          text = (
              text[:start]
              + new_share
              + text[next_marker:]
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print("Share function fixed successfully.")
          PY

      - name: Verify Android Project
        run: |
          set -e

          test -f "android-app/settings.gradle"
          test -f "android-app/build.gradle"
          test -f "android-app/app/build.gradle"

          test -f \
            "android-app/app/src/main/AndroidManifest.xml"

          test -f \
            "android-app/app/src/main/java/com/rabilu/quranaudio/MainActivity.java"

          test -f \
            "android-app/app/src/main/assets/index.html"

          test -f \
            "android-app/app/src/main/assets/style.css"

          test -f \
            "android-app/app/src/main/assets/script.js"

          test -f \
            "android-app/app/src/main/assets/assets/icon.png"

          test -f \
            "android-app/app/src/main/assets/assets/splash.png"

          test -f \
            "android-app/app/src/main/res/drawable/icon.png"

          test -d \
            "android-app/app/src/main/assets/audio"

          grep -q "AndroidShare" \
            "android-app/app/src/main/java/com/rabilu/quranaudio/MainActivity.java"

          grep -q "AndroidShare" \
            "android-app/app/src/main/assets/script.js"

          echo "Android project verified."

      - name: Build Debug APK
        working-directory: android-app
        run: |
          set -e

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        run: |
          set -e

          find android-app/app/build/outputs \
            -type f \
            -name "*.apk" \
            -print

          test -n "$(
            find android-app/app/build/outputs \
            -type f \
            -name "*.apk" \
            -print -quit
          )"

          echo "APK found successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HAFIZ-Yusuf-Shuaibu-Bauchi-Complete-Quran-APK
          path: "android-app/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error

      - name: Build Summary
        run: |
          echo "=========================================="
          echo "APK BUILD SUCCESS"
          echo "NATIVE SHARE ENABLED"
          echo "APP ICON INCLUDED"
          echo "=========================================="

          find android-app/app/build/outputs \
            -type f \
            -name "*.apk" \
            -print
