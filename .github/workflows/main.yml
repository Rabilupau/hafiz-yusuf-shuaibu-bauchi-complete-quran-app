name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Quran App
        run: |
          unzip -q "Qur'an-Audio-App Original.zip"
          echo "Files extracted:"
          find . -maxdepth 4 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" \) | sort

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find . -type f -name "settings.gradle" -o -type f -name "settings.gradle.kts" | head -n 1 | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found."
            echo "Folders and files inside ZIP:"
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HAFIZ-Yusuf-Shuaibu-Bauchi-Complete-Quran-APK
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
